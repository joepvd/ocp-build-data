content:
  source:
    dockerfile: images/cli/Dockerfile.rhel
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/oc.git
      web: https://github.com/openshift/oc
    ci_alignment:
      streams_prs:
        ci_build_root:
          member: ci-openshift-build-root-latest.rhel9
    modifications:
    - action: replace
      match: 'COPY . .'
      replacement: |
          COPY . .
          RUN GOMAXPROCS= go run nproc.go
          RUN go run nproc.go
    - action: add
      source: https://gist.githubusercontent.com/joepvd/2d2cb50ee311be422fbda246b0467e02/raw/0dfbaa55532b535cb1867ce40de4a5d73b02aaac/nproc.go
      path: nproc.go
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: openshift-enterprise-cli-container
  namespace: containers
delivery:
  # Maps to honeybadger repo_name
  repo_name: ose-cli
  delivery_repo_names:
  - openshift4/ose-cli-rhel9
for_payload: true
from:
  builder:
  - stream: rhel-9-golang
  member: openshift-enterprise-base-rhel9
labels:
  License: GPLv2+
  io.k8s.description: OpenShift is a platform for developing, building, and deploying containerized applications.
  io.k8s.display-name: OpenShift Client
  io.openshift.tags: openshift,cli
name: openshift/ose-cli-rhel9
payload_name: cli
owners:
- aos-master@redhat.com
konflux:
  network_mode: open
  cachi2:
    enabled: false
